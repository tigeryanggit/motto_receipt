services:
  receipts:
    image: receipts-app:latest
    build: .
    container_name: receipts-app
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      TZ: Asia/Hong_Kong
      NEXT_TELEMETRY_DISABLED: "1"
      RECEIPTS_DIR: /app/receipts
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./Receipts:/app/receipts
    networks:
      - motto_default
    expose:
      - "3000"

networks:
  motto_default:
    external: true
